name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the older run.
# Each push to main gets its own group, so GitHub never cancels a waiting run on main.
concurrency:
  group: ${{ github.workflow }}-${{ case(github.event_name == 'pull_request', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The rules for main require a job named "check". If you rename it, change scripts/configure-github too.
  # If you split the checks into several jobs, make "check" need them all, run with if: always() and fail
  # unless each one passed or was skipped. Otherwise a failed job skips "check", and GitHub counts a skip as a pass.
  check:
    runs-on: ubuntu-latest
    # Stops a stuck run. It's well above the time goal under "Commands" in AGENTS.md, so a slow run still finishes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # On a public repository, fail a pull request that adds a dependency with a known vulnerability.
      # A private repository needs a paid add-on for this, so it skips the step.
      - name: Check new dependencies for known vulnerabilities
        if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      # To update a tool, change its version and its checksum. GitHub lists the
      # SHA-256 checksum of every file on the tool's release page.
      - name: Install shellcheck, actionlint and zizmor
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ZIZMOR_VERSION: 1.30.1
          ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"

          curl -fsSLo shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  shellcheck.tar.xz" | sha256sum --check
          tar -xJf shellcheck.tar.xz -C "$bin" --strip-components=1 "shellcheck-v$SHELLCHECK_VERSION/shellcheck"

          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz -C "$bin" actionlint

          curl -fsSLo zizmor.tar.gz "https://github.com/zizmorcore/zizmor/releases/download/v$ZIZMOR_VERSION/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ZIZMOR_SHA256  zizmor.tar.gz" | sha256sum --check
          tar -xzf zizmor.tar.gz -C "$bin" zizmor

          echo "$bin" >> "$GITHUB_PATH"

      # Install the project's toolchain here, from its pinned version file.

      # zizmor uses the job's read-only token to check the actions in the workflows against GitHub's advisories.
      - run: scripts/check
        env:
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}
