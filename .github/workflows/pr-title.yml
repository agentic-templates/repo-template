name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  # The rules for main require a job named "title". If you rename it, change scripts/configure-github too.
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # scripts/check-pull-request reads the issues that the body closes.
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check that the title follows the rules for a commit subject
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types="feat|fix|docs|test|refactor|perf|build|ci|revert|chore"
          pattern="^($types)(\([^)]+\))?!?: [^ ]"
          if [[ "$TITLE" =~ $pattern ]]; then
            exit 0
          fi
          echo "::error::The title \"$TITLE\" doesn't follow the format \"<type>: <what changed>\". Edit the title to match. The types are ${types//|/, }."
          exit 1

      # Dependabot's pull requests have no issue and no template, so these two steps skip them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        with:
          persist-credentials: false

      - name: Check that the body closes an open issue and fills in the template
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/check-pull-request

  # Release notes group pull requests by this label, as .github/release.yml sets out.
  # Pull requests from forks and from Dependabot get a read-only token, so this job skips them.
  # Dependabot's updates are left out of release notes, and whoever merges a fork's pull request labels it by hand.
  label:
    needs: title
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - name: Label the pull request with the type in its title
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          case "$TITLE" in
            feat*) label=feature ;;
            fix*) label=bug ;;
            *) label=maintenance ;;
          esac
          others=$(printf '%s\n' feature bug maintenance | grep -vx "$label" | paste -sd, -)
          gh pr edit "$PR_URL" --add-label "$label" --remove-label "$others"
